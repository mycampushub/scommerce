# Cloudflare Pages Configuration
# This file is used by Cloudflare Pages deployment
#
# Note: For Cloudflare Pages with Next.js:
# - D1, R2, and KV bindings are configured in Cloudflare Dashboard
# - Build configuration is handled by Pages deployment settings
# - This file is kept for local development reference only

name = "scommerce"
compatibility_date = "2024-01-01"

# Environment Variables (also set in Cloudflare Dashboard)
[vars]
NODE_ENV = "production"
# Redis configuration (if using external Redis)
# REDIS_URL = "redis://your-redis-url"
# REDIS_PASSWORD = "your-redis-password"

# Cloudflare Pages Configuration Reference
#
# For production deployment, configure in Cloudflare Dashboard:
# 1. Connect D1 Database binding: "DB"
# 2. Connect R2 Storage binding: "BUCKET"
# 3. (Optional) Connect KV Namespace binding: "CACHE"
# 4. Set environment variables for DATABASE_URL, NEXT_PUBLIC_SITE_URL, etc.
#
# To create D1 database: wrangler d1 create scommerce-db
# To create R2 bucket: wrangler r2 bucket create scommerce-uploads
#
# Build command is handled by Cloudflare Pages deployment settings
# No need for [build] section in wrangler.toml for Pages
