# Cloudflare Workers/Pages configuration for scommerce
name = "scommerce"
compatibility_date = "2026-04-26"

# D1 Database bindings for Cloudflare Pages
# IMPORTANT: database_id must be your REAL database ID from wrangler
# Get it with: npx wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "scommerce-db"
# REPLACE THIS with your real database_id from wrangler d1 list output
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# R2 Storage for file uploads
# IMPORTANT: bucket_name must match your actual bucket
# Get it with: npx wrangler r2 bucket list
[[r2_buckets]]
binding = "scommerce_uploads"
bucket_name = "scommerce-uploads"

# KV Namespace for rate limiting and caching
# IMPORTANT: id must be your REAL KV namespace ID from wrangler
# Get it with: npx wrangler kv:namespace list
[[kv_namespaces]]
binding = "KV"
# REPLACE THIS with your real KV id from wrangler kv:namespace list output
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[observability]
enabled = true
