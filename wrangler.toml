name = "scommerce"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# D1 Database bindings
[[d1_databases]]
binding = "DB"
database_name = "scommerce-db"
database_id = "scommerce-db-id"

# R2 Storage for file uploads
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "scommerce-uploads"

# KV Namespace for rate limiting and caching
[[kv_namespaces]]
binding = "KV"
id = "scommerce-kv"

# For Cloudflare Pages deployment with next-on-pages
pages_build_output_dir = ".vercel/output/static"

[observability]
enabled = true
